# Build and publish dist/ to GitHub Pages on every push to main, and once a day
# so the schedule stays in sync with the league's iCal feed.
# Repo settings → Pages → Source: "GitHub Actions". Works at
# https://<user>.github.io/<repo>/ (all links are relative, so subpaths are fine).
# Optional: add a repository secret SCHEDULE_ICS_URL (the LeagueApps iCal export
# URL) so each build pulls the latest practices and games.
name: Deploy site

on:
  push:
    branches: [main]
#  schedule:
#    - cron: '0 13 * * *' # 6 am Pacific, daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh schedule from the league feed
        run: node refresh-schedule.mjs
        env:
          SCHEDULE_ICS_URL: ${{ secrets.SCHEDULE_ICS_URL }}
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
